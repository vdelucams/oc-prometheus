global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Orka operator (VM lifecycle metrics) — ssd-labs L20
  - job_name: "orka-operator"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.221.192.20:8080"]
        labels:
          instance: "orka-operator"

  # Orka node exporters — ssd-labs L20 (10.221.192.0/24)
  # instance label overridden with the friendly hostname so every panel/table
  # reads in plain English instead of "10.221.192.31:9100".
  - job_name: "orka-nodes"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.221.192.31:9100"]
        labels: { instance: "x86-mini-1" }
      - targets: ["10.221.192.32:9100"]
        labels: { instance: "x86-mini-2" }
      - targets: ["10.221.192.33:9100"]
        labels: { instance: "x86-mini-3" }
      - targets: ["10.221.192.34:9100"]
        labels: { instance: "x86-mini-4" }
      - targets: ["10.221.192.35:9100"]
        labels: { instance: "arm-mini-005" }
      - targets: ["10.221.192.36:9100"]
        labels: { instance: "arm-mini-006" }
      - targets: ["10.221.192.37:9100"]
        labels: { instance: "arm-studio-007" }
      - targets: ["10.221.192.38:9100"]
        labels: { instance: "m2-mini-008" }
      - targets: ["10.221.192.39:9100"]
        labels: { instance: "m2-mini-009" }

  # --- OCI / Harbor registry: no scrapeable endpoint discovered on the routed
  # --- subnets for this lab (no Harbor registered in Nautobot for ORKL10000018).
  # --- Add the target here once the OCI IP/metrics port is known, e.g.:
  # - job_name: "oci-registry"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["10.221.192.XXX:9107"]
