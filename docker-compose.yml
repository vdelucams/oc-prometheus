services:
  # Generates prometheus.yml from .env before Prometheus starts, so the IP plan
  # only needs to be set once (in .env). Runs to completion on every `up`.
  config-init:
    image: alpine:3
    container_name: oc-prometheus-config-init
    env_file: .env
    volumes:
      - ./prometheus:/etc/prometheus
    command: sh /etc/prometheus/generate-config.sh
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: oc-prometheus
    depends_on:
      config-init:
        condition: service_completed_successfully
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: oc-prometheus-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
